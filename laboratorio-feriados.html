<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeuControle — Laboratório de Feriados</title>
<style>body{font:15px system-ui,sans-serif;background:#eef4f0;color:#213b30;margin:0;padding:20px}main{max-width:840px;margin:auto}header,.mc-special-card,.calendar-events-panel{background:white;padding:20px;border-radius:16px;margin:14px 0;box-shadow:0 3px 18px #143b2612}h1{margin:0 0 8px}p{line-height:1.5}.tools{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #c5d7cd;background:white;padding:9px 12px;border-radius:9px}.mc-cal-board-v124{background:white;padding:15px;border-radius:16px}.mc-cal-grid-v124{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.mc-cal-day-v124{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center}.mc-cal-dots-v124{display:flex;gap:3px;margin-top:6px}.mc-cal-day-num-v124{font-weight:700}.selected{outline:2px solid #1684c6}.note{font-size:12px;color:#61756b}</style></head>
<body><main><header><h1>🧪 Laboratório de Feriados</h1><p>Prévia isolada para verificar marcações e controles. Não utiliza seus dados, não conecta ao Supabase e não altera o MeuControle principal.</p><div class="tools"><button id="prev">◀ Mês anterior</button><strong id="monthLabel"></strong><button id="next">Próximo mês ▶</button><button id="reset">Limpar preferências deste laboratório</button></div></header>
<section id="settingsPage"><div class="settings-grid"><section class="mc-special-card"><h3>Datas Especiais</h3><p class="note">Área simulada. O módulo de feriados deve aparecer abaixo.</p></section></div></section>
<section id="calendarPage"><div class="mc-cal-board-v124"><div class="mc-cal-grid-v124" id="grid"></div></div><div class="calendar-events-panel"><h3>Dia selecionado</h3><div class="calendar-events-scroll"></div></div></section>
<p class="note" id="status">Carregando módulo experimental...</p></main>
<script>
let calendarYear=2026,calendarMonth=10;const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];let selected=20;
function draw(){document.getElementById('monthLabel').textContent=months[calendarMonth]+' '+calendarYear;const grid=document.getElementById('grid');grid.innerHTML='';const count=new Date(calendarYear,calendarMonth+1,0).getDate();for(let d=1;d<=count;d++){const b=document.createElement('button');b.className='mc-cal-day-v124'+(d===selected?' selected':'');b.dataset.day=d;b.innerHTML='<span class="mc-cal-day-num-v124">'+d+'</span><span class="mc-cal-dots-v124"></span>';b.onclick=()=>{selected=d;draw()};grid.appendChild(b)}if(window.MeuControleHolidaysV1)setTimeout(()=>window.dispatchEvent(new CustomEvent('meucontrole:holidays-changed')),20)}
document.getElementById('prev').onclick=()=>{calendarMonth--;if(calendarMonth<0){calendarMonth=11;calendarYear--}selected=1;draw()};
document.getElementById('next').onclick=()=>{calendarMonth++;if(calendarMonth>11){calendarMonth=0;calendarYear++}selected=1;draw()};
document.getElementById('reset').onclick=()=>{localStorage.removeItem('meu_controle_holidays_v1');location.reload()};
draw();
</script>
<script src="https://cdn.jsdelivr.net/gh/ceducunha-alt0609/MeuControle@feature-feriados-inteligentes-2026-11-16/holiday-center-v175.js"></script>
<script>setTimeout(()=>{document.getElementById('status').textContent=window.MeuControleHolidaysV1?'Módulo carregado. Teste os meses e os controles acima.':'Módulo não carregou: confira sua conexão com a internet.'},1500);</script>
</body></html>
