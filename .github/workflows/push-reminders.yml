name: MeuControle Push Reminders

on:
  schedule:
    # Dois relógios defasados aumentam a chance de execução pontual quando o
    # scheduler do GitHub atrasa ou descarta uma das janelas de alta carga.
    - cron: '2-59/5 * * * *'
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Se duas execuções atrasadas coincidirem, processa em sequência para evitar
# que dois jobs leiam o mesmo lembrete como pendente ao mesmo tempo.
concurrency:
  group: meucontrole-push-reminders
  cancel-in-progress: false

jobs:
  send-push-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/919790043994/locations/global/workloadIdentityPools/github/providers/meucontrole-github'
          service_account: 'firebase-adminsdk-fbsvc@meucontrole-b8f2d.iam.gserviceaccount.com'
          create_credentials_file: true

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase Admin
        run: npm install --no-save firebase-admin@13

      - name: Disparar lembretes vencidos
        run: node .github/scripts/send-push-reminders.mjs
